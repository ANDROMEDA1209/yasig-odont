services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEMO: "true"
      APP_URL: http://localhost:8080
      APP_TIMEZONE: America/Guayaquil
      SESSION_SECURE: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: yasig_odont
      DB_USERNAME: yasig
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
    volumes:
      - clinical_files:/var/www/html/storage/private
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: yasig_odont
      MYSQL_USER: yasig
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
  clinical_files:
