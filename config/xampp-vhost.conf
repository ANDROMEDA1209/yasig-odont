# Añadir a C:/xampp/apache/conf/extra/httpd-vhosts.conf; habilitar su Include en httpd.conf.
<VirtualHost *:80>
    ServerName yasig.local
    DocumentRoot "C:/xampp/htdocs/dental_care/public"
    <Directory "C:/xampp/htdocs/dental_care/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
# Añadir a C:/Windows/System32/drivers/etc/hosts: 127.0.0.1 yasig.local
# Configurar APP_URL=http://yasig.local y reiniciar Apache.
